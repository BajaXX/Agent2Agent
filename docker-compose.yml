# Agent2Agent 平台 — Docker Compose 部署
#
# 用法：
#   docker compose up -d --build     # 构建并启动全部实例
#   docker compose logs -f           # 查看日志（可指定服务名）
#   docker compose down              # 停止（数据保留在宿主机）
#
# 数据持久化：宿主目录 ↔ 容器 /data（SQLite + accounts/ 全部在此）
# 备份 = 拷贝对应数据目录；换机迁移 = 把该目录拷到新机同路径再启动。
#
# 多实例（多团队隔离）：
#   - agent2agent      : 主实例，宿主 3081 端口，数据 /data/a2a_data
#   - agent2agent-team2: 第二团队实例，宿主 3333 端口，数据 /data/a2a_data_team2
#   两个实例端口、数据、账号体系完全独立，互不可见。
#   如需更多实例：复制 team2 服务块，改端口（如 4444）与数据目录（如 /data/a2a_data_team3）即可。

services:
  agent2agent:
    build: .
    image: agent2agent:latest
    container_name: agent2agent
    ports:
      - "${A2A_PORT:-3081}:3081"
    environment:
      A2A_PORT: "3081"
      A2A_HOST: "0.0.0.0"
      A2A_DATA_DIR: "/data"
      # A2A_TTL_MIN: "15"      # 在线判定 TTL（分钟），按需调整
      # A2A_MAX_FILE_MB: "50"  # 单文件上传上限（MB）
    volumes:
      - /data/a2a_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3081/api/v1/summary').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  agent2agent-team2:
    build: .
    image: agent2agent:latest
    container_name: agent2agent-team2
    ports:
      - "${A2A_TEAM2_PORT:-3333}:3081"
    environment:
      A2A_PORT: "3081"
      A2A_HOST: "0.0.0.0"
      A2A_DATA_DIR: "/data"
    volumes:
      - /data/a2a_data_team2:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3081/api/v1/summary').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
