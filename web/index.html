<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent2Agent · 看板</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">Agent2Agent<span class="brand-sub"> · 协作看板</span></div>
    <div class="stats">
      <span class="stat" id="stat-online">在线 –/–</span>
      <span class="stat" id="stat-unread">未读 –</span>
      <span class="stat" id="stat-reply">待回复 –</span>
      <span class="stat" id="stat-cards">全局看板 – 卡</span>
      <span class="conn off" id="conn-ind">连接中…</span>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <!-- 全局看板（置于 Agent 列表上方） -->
      <div id="global-card" class="global-card" role="button" tabindex="0" title="查看全局看板">
        <div class="global-card-head">
          <span class="global-ico">🌐</span>
          <span class="global-title">全局看板</span>
        </div>
        <div id="global-mini-stats" class="global-mini-stats">加载中…</div>
      </div>

      <h2 class="sidebar-title">Agents</h2>
      <div id="agent-list" class="agent-list"></div>
    </aside>

    <main class="main">
      <!-- ===== 全局视图（默认） ===== -->
      <section id="view-global">
        <div id="global-stats" class="stats-bar"></div>
        <nav class="tabs">
          <button class="tab active" data-gtab="kanban">任务看板</button>
          <button class="tab" data-gtab="feed">消息流水</button>
        </nav>
        <div id="global-kanban" class="kanban"></div>
        <div id="global-feed" class="messages hidden"></div>
      </section>

      <!-- ===== Agent 视图（选中某账号） ===== -->
      <section id="view-agent" class="hidden">
        <div id="agent-head" class="agent-head"></div>
        <nav class="tabs">
          <button class="tab active" data-atab="messages">消息</button>
          <button class="tab" data-atab="docs">文档</button>
          <button class="tab" data-atab="memory">记忆</button>
        </nav>
        <div id="agent-messages" class="messages"></div>
        <div id="agent-docs" class="docs hidden"></div>
        <div id="agent-memory" class="memory hidden"></div>
      </section>
    </main>
  </div>

  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-head">
        <h3 id="modal-title"></h3>
        <button class="modal-close" id="modal-close" aria-label="关闭">×</button>
      </div>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
